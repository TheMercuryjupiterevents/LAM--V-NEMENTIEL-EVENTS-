 <radialGradient id="pearl"><stop stop-color="#fff"/><stop offset=".55" stop-color="#f8f8fb"/><stop offset="1" stop-color="#c6cad2"/></radialGradient>
 <filter id="soft" x="-15%" y="-20%" width="130%" height="140%"><feGaussianBlur stdDeviation="1.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
