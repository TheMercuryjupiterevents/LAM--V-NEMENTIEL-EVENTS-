<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fffaf0">
<title>Bienvenue chez LAM — Puissance. Prestige. Perfection.</title>
<style>
:root{--cream:#fffaf0;--blue:#123fbd;--orange:#f36b16;--yellow:#ffd21a;--red:#e51b23}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{background:var(--cream);color:var(--blue);font-family:Georgia,serif}
.screen{position:relative;width:100%;height:100svh;min-height:560px;overflow:hidden;background:linear-gradient(180deg,#fffdf7 0%,var(--cream) 100%);display:flex;align-items:center;justify-content:center}
.topline{position:absolute;top:max(28px,env(safe-area-inset-top));left:5%;z-index:5;font-size:clamp(13px,2.5vw,22px);letter-spacing:.12em;color:#241a18;line-height:1.2}
.topline:after{content:"";display:block;width:68%;height:3px;background:var(--orange);margin-top:10px}
.skip{position:absolute;z-index:10;right:5%;top:max(26px,env(safe-area-inset-top));border:3px solid var(--orange);border-radius:40px;background:var(--blue);color:white;padding:12px 24px;font:700 14px Georgia,serif;letter-spacing:.1em;cursor:pointer}
.composition{position:relative;width:min(94vw,680px);height:min(82svh,900px);min-height:490px;margin-top:35px;display:flex;align-items:center;justify-content:center}
.sun{position:absolute;top:1%;left:50%;width:min(62vw,430px);aspect-ratio:1;transform:translateX(-50%) scale(.7);opacity:0;border-radius:50%;background:repeating-conic-gradient(from 0deg,var(--yellow) 0deg 1deg,transparent 1deg 7deg);-webkit-mask:radial-gradient(circle,transparent 0 47%,#000 48% 70%,transparent 71%);mask:radial-gradient(circle,transparent 0 47%,#000 48% 70%,transparent 71%);animation:sunIn 1.1s ease .2s forwards}
.sun-disc{position:absolute;top:10%;left:50%;width:min(43vw,295px);aspect-ratio:1;transform:translateX(-50%) scale(.8);opacity:0;border-radius:50%;background:radial-gradient(circle at 50% 50%,#ffe943 0 30%,#ff9a12 61%,#ef3c16 100%);animation:discIn 1s ease .45s forwards}
.arch{position:absolute;left:50%;bottom:1%;transform:translateX(-50%) scaleY(.88);transform-origin:bottom;width:min(90%,610px);height:72%;border:clamp(12px,2.2vw,21px) solid var(--blue);border-bottom:0;border-radius:50% 50% 0 0;box-shadow:inset 0 0 0 9px var(--orange),inset 0 0 0 19px var(--yellow);opacity:0;animation:archIn 1.1s ease .75s forwards}
.triangle-group{position:absolute;z-index:3;left:50%;top:48%;transform:translate(-50%,-50%);width:min(88vw,560px);height:66%;opacity:0;animation:copyIn .9s ease 1.15s forwards}
.triangle-group svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.triangle-copy{position:absolute;left:50%;top:53%;transform:translate(-50%,-50%);width:69%;display:flex;flex-direction:column;align-items:center;text-align:center;gap:clamp(5px,1.1vh,11px)}
.monogram{font-size:clamp(48px,12vw,94px);font-weight:700;font-style:italic;line-height:.88;letter-spacing:-.08em;white-space:nowrap}
.monogram .l,.monogram .m{color:var(--red)}
.monogram .a{color:var(--yellow)}
.brand{font-size:clamp(11px,2.65vw,20px);font-weight:700;color:#123fbd;letter-spacing:.005em;line-height:1.15}
.brand span{color:var(--orange)}
.triangle-rule{width:76%;height:2px;background:var(--orange);margin:2px 0}
.welcome{font-family:"Brush Script MT","Segoe Script",cursive;font-size:clamp(18px,4.3vw,32px);font-style:italic;color:var(--blue);white-space:nowrap}
.motto{font-family:"Brush Script MT","Segoe Script",cursive;font-style:italic;font-size:clamp(16px,3.7vw,28px);color:#971d1d;white-space:nowrap}
@keyframes sunIn{to{opacity:1;transform:translateX(-50%) scale(1)}}
@keyframes discIn{to{opacity:1;transform:translateX(-50%) scale(1)}}
@keyframes archIn{to{opacity:1;transform:translateX(-50%) scaleY(1)}}
@keyframes copyIn{from{opacity:0;translate:0 18px}to{opacity:1;translate:0 0}}
@media(max-width:520px){
 .composition{width:100vw;height:79svh;margin-top:55px}
 .sun{width:76vw;top:3%}
 .sun-disc{width:53vw;top:12%}
 .arch{width:94%;height:68%;border-width:13px;box-shadow:inset 0 0 0 6px var(--orange),inset 0 0 0 13px var(--yellow)}
 .triangle-group{top:48%;width:94vw;height:61%}
 .triangle-copy{top:54%;width:69%;gap:clamp(4px,.9vh,8px)}
 .monogram{font-size:clamp(43px,11.5vw,76px)}
 .brand{font-size:clamp(10px,2.7vw,15px)}
 .welcome{font-size:clamp(16px,4.1vw,24px)}
 .motto{font-size:clamp(14px,3.5vw,21px)}
 .topline{max-width:52%;font-size:13px}
 .skip{padding:10px 17px;font-size:12px}
}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-delay:0ms!important}}
</style>
</head>
<body>
<main class="screen">
 <div class="topline">UNE SIGNATURE<br>D’EXCEPTION</div>
 <button class="skip" id="skip">PASSER ›</button>
 <div class="composition" aria-label="Bienvenue chez LAM">
  <div class="sun" aria-hidden="true"></div>
  <div class="sun-disc" aria-hidden="true"></div>
  <div class="arch" aria-hidden="true"></div>
  <div class="triangle-group" aria-label="LAM ÉVÉNEMENTIEL & EVENTS">
   <svg viewBox="0 0 600 650" role="img" aria-hidden="true">
    <polygon points="300,16 582,620 18,620" fill="#fffdf7" stroke="#123fbd" stroke-width="16" stroke-linejoin="round"/>
    <polygon points="300,43 555,602 45,602" fill="none" stroke="#f36b16" stroke-width="7" stroke-linejoin="round"/>
    <polygon points="300,61 538,585 62,585" fill="none" stroke="#ffd21a" stroke-width="5" stroke-linejoin="round"/>
   </svg>
   <div class="triangle-copy">
    <div class="monogram" aria-label="LAM"><span class="l">L</span><span class="a">A</span><span class="m">M</span></div>
    <div class="brand">ÉVÉNEMENTIEL<br><span>&amp; EVENTS</span></div>
    <div class="triangle-rule" aria-hidden="true"></div>
    <div class="welcome">Bienvenue chez LAM</div>
    <div class="triangle-rule" aria-hidden="true"></div>
    <div class="motto">Puissance. Prestige. Perfection.</div>
   </div>
  </div>
 </div>
</main>
<script>
(function(){
 const enter=()=>{
  try{sessionStorage.setItem('lamWelcomeSeen','yes')}catch(e){}
  window.location.replace('./?entered=1');
 };
 document.getElementById('skip').addEventListener('click',enter);
 window.setTimeout(enter,9000);
})();
</script>
</body>
</html>
