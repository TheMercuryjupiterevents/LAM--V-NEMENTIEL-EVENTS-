<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fffaf0">
<title>Bienvenue chez LAM — Puissance. Prestige. Perfection.</title>
<style>
:root{--cream:#fffaf0;--blue:#123fbd;--orange:#f36b16;--yellow:#ffd21a;--red:#e51b23;--burgundy:#741b27}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--cream)}
body{font-family:Georgia,serif}
.screen{position:relative;width:100%;height:100svh;min-height:540px;background:linear-gradient(180deg,#fffefa,#fffaf0);overflow:hidden}
.art{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:1;animation:artFade .35s ease 5s forwards}.final-art{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:2;opacity:0;pointer-events:none;animation:finalShow .35s ease 5s forwards}.final-art *{animation:none!important;opacity:1!important;stroke-dashoffset:0!important}
.headline{font-family:Georgia,serif;font-weight:600;letter-spacing:3px;fill:#27191b}
.skip{position:absolute;z-index:5;right:5%;top:max(28px,env(safe-area-inset-top));border:4px solid var(--orange);border-radius:50px;background:var(--blue);color:#fff;padding:12px 23px;font:700 clamp(12px,3vw,19px) Georgia,serif;letter-spacing:2px;box-shadow:0 2px 0 #f9b72b;cursor:pointer}
.sun-rays{transform-origin:450px 640px;animation:rayTurn 70s linear infinite}
.sun-disc{transform-origin:450px 640px;animation:sunRise 2.5s ease-out both}
.arch-lines,.triangle-lines{stroke-dasharray:4200;stroke-dashoffset:4200;animation:draw 2.8s ease-out .7s forwards}
.triangle-lines{animation-delay:1.4s}
.branding{opacity:0;animation:fadeUp .9s ease 2.8s forwards}
.welcome{opacity:0;animation:fadeUp .9s ease 3.4s forwards}
.motto{opacity:0;animation:fadeUp .9s ease 4s forwards}
@keyframes rayTurn{to{transform:rotate(360deg)}}
@keyframes sunRise{from{opacity:.2;transform:scale(.88)}to{opacity:1;transform:scale(1)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes artFade{to{opacity:0}}\n@keyframes finalShow{to{opacity:1}}\n@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;opacity:1!important;stroke-dashoffset:0!important}}
.screen.finished .sun-rays{animation-play-state:paused}
.screen.finished .sun-disc,.screen.finished .arch-lines,.screen.finished .triangle-lines,.screen.finished .branding,.screen.finished .welcome,.screen.finished .motto{animation-play-state:paused}
</style>
</head>

<script>
(function(){
 const screen=document.querySelector('.screen');
 const enter=()=>{try{sessionStorage.setItem('lamWelcomeSeen','yes')}catch(e){};window.location.replace('./?entered=1')};
 document.getElementById('skip').addEventListener('click',enter);
 // Phase 1: five-second animation. Phase 2: hold the completed LAM artwork.
 window.setTimeout(()=>{screen.classList.add('finished');},5000);
 window.setTimeout(enter,8000);
})();
