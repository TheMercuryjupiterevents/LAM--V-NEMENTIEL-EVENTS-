<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
<title id="title">Emblème LAM cercle et triangle or</title>
<desc id="desc">Cercle et triangle champagne gold brillant, les trois sommets du triangle touchent le cercle, lettres LAM jaune au centre, fond blanc.</desc>
<defs>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#FFF3C9"/>
    <stop offset=".18" stop-color="#DDAA38"/>
    <stop offset=".34" stop-color="#FFF0A6"/>
    <stop offset=".52" stop-color="#C88A1D"/>
    <stop offset=".7" stop-color="#FFE7A0"/>
    <stop offset=".88" stop-color="#D49A2B"/>
    <stop offset="1" stop-color="#FFF2C7"/>
  </linearGradient>
  <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FFFBEA"/>
    <stop offset=".25" stop-color="#E7BE62"/>
    <stop offset=".5" stop-color="#FFF3C4"/>
    <stop offset=".72" stop-color="#B87917"/>
    <stop offset="1" stop-color="#F9E3A0"/>
  </linearGradient>
  <filter id="soft" x="-15%" y="-15%" width="130%" height="130%">
    <feGaussianBlur stdDeviation="2.2"/>
  </filter>
</defs>
<rect width="1024" height="1024" fill="#FFFFFF"/>
<circle cx="512" cy="512" r="490" fill="none" stroke="#E7C46F" stroke-width="25" opacity=".22" filter="url(#soft)"/>
<circle cx="512" cy="512" r="490" fill="none" stroke="url(#gold)" stroke-width="18"/>
<circle cx="512" cy="512" r="478" fill="none" stroke="url(#shine)" stroke-width="3" opacity=".9"/>
<path d="M512 22 L85 758 L939 758 Z" fill="none" stroke="url(#gold)" stroke-width="24" stroke-linejoin="round"/>
<path d="M512 22 L85 758 L939 758 Z" fill="none" stroke="url(#shine)" stroke-width="5" stroke-linejoin="round" opacity=".95"/>
<text x="512" y="642" text-anchor="middle" fill="#FFD400" stroke="#E8B900" stroke-width="1.5" paint-order="stroke fill" font-family="'Arial Rounded MT Bold','Trebuchet MS',Arial,sans-serif" font-size="205" font-weight="900" letter-spacing="-10">LAM</text>
</svg>